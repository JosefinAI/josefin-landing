  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n  <div class=\"marquee-track\">\n    <span>Less chasing. Less reminding.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>Coordination without the chaos.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>No more forgotten appointments.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>Tomorrow, briefed today.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>Less chasing. Less reminding.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>Coordination without the chaos.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>No more forgotten appointments.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n    <span>Tomorrow, briefed today.<\u002Fspan><span class=\"dot\">·<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PROBLEM SECTION -->\n<section class=\"problem-sec\" id=\"problem\" data-screen-label=\"Problem\" style=\"padding: 60px 80px;\">\n  <div class=\"problem-grid\">\n    <div>\n      <div class=\"sec-eye\">The problem<\u002Fdiv>\n      <h2 class=\"problem-h\">You didn't sign up to be the\nHousehold Project Manager.<\u002Fh2>\n      <p class=\"problem-lede\">The problem isn't your being last minute, disorganised, or too busy. It's that households don't have operating systems.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <ul class=\"problem-bullets\">\n        <li><span class=\"pb-ico\">📧<\u002Fspan><span>School sends 80 emails a month<\u002Fspan><\u002Fli>\n        <li><span class=\"pb-ico\">💬<\u002Fspan><span>WhatsApp groups multiply<\u002Fspan><\u002Fli>\n        <li><span class=\"pb-ico\">🗓️<\u002Fspan><span>Calendars and emails don't sync - appointments get missed<\u002Fspan><\u002Fli>\n        <li><span class=\"pb-ico\">👥<\u002Fspan><span>Partner asks “did you tell the nanny?”<\u002Fspan><\u002Fli>\n        <li><span class=\"pb-ico\">🧠<\u002Fspan><span>You need to remember to book half-term flights and hotel<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <p class=\"problem-coda\" data-comment-anchor=\"45c7d1ab82-p\">One person shouldn't be the household's CPU.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW IT WORKS -->\n<section class=\"section\" id=\"how\" style=\"background:#1C1209;\">\n  <div class=\"wrap\">\n    <div class=\"how-inner\">\n      <div class=\"how-left\">\n        <div class=\"sec-eye\" style=\"color:#C49020;\">No new apps<\u002Fdiv>\n        <h2 class=\"sec-h\" style=\"color:#F5F0E8;\">Josefin lives where\nyou already are.<\u002Fh2>\n        <p class=\"sec-sub how-sub\" style=\"margin-top:1rem; color:#F5F0E8;\" id=\"howSub\">No new tool to learn. No new habit to keep. Josefin slips into the rhythm of the household you already run. Not a task manager. Not another app to maintain. Just the connective tissue between everything already happening.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"how-steps\">\n        <div class=\"how-step\">\n          <div class=\"how-num\">01<\u002Fdiv>\n          <div class=\"how-icon ic-email\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#EA4335\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"4.5\" width=\"19\" height=\"15\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"how-title\" style=\"color:#F5F0E8;\">Notices what matters.<\u002Fdiv>\n          <div class=\"how-body\" style=\"color:#F5F0E8;\">Forward or sync your inbox. The school deadlines, insurance payments and medical appointment dates quietly surface. The rest stays out of your way.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"how-step\">\n          <div class=\"how-num\">02<\u002Fdiv>\n          <div class=\"how-icon ic-cal\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1A73E8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M16 3v4M8 3v4M3 10h18\"><\u002Fpath><circle cx=\"12\" cy=\"15.5\" r=\"1.4\" fill=\"#1A73E8\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"how-title\" style=\"color:#F5F0E8;\">Nothing slips through.<\u002Fdiv>\n          <div class=\"how-body\" style=\"color:#F5F0E8;\">It lands in your calendar before you think to add it. Reminders set themselves. Clashes across personal and professional calendars show up before they become problems.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"how-step\">\n          <div class=\"how-num\">03<\u002Fdiv>\n          <div class=\"how-icon ic-wa\">\n            <svg width=\"38\" height=\"38\" viewBox=\"0 0 32 32\"><rect width=\"32\" height=\"32\" rx=\"8\" fill=\"#25D366\"><\u002Frect><path d=\"M16 6.5C10.7 6.5 6.5 10.7 6.5 16c0 1.7.45 3.35 1.3 4.8L6.5 25.5l4.8-1.28A9.4 9.4 0 0016 25.5c5.3 0 9.5-4.2 9.5-9.5S21.3 6.5 16 6.5zm4.65 12.87c-.19.54-1.1 1.02-1.52 1.08-.39.06-.88.08-1.43-.1-.33-.1-.76-.24-1.3-.48-2.28-.99-3.77-3.29-3.88-3.44-.12-.15-.91-1.22-.91-2.32s.57-1.65.78-1.88c.19-.21.42-.26.56-.26h.4c.13 0 .3-.05.48.36.19.44.63 1.52.68 1.63.06.11.1.24.02.38-.07.15-.11.24-.23.37-.11.12-.24.27-.34.37-.11.11-.23.23-.1.45.13.22.57.94 1.24 1.52.85.76 1.57 1 1.79 1.11.22.11.35.1.48-.06.13-.15.55-.64.7-.86.14-.22.29-.18.48-.1.19.07 1.17.55 1.37.66.19.1.32.15.37.24.05.08.05.44-.14.99z\" fill=\"white\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"how-title\" style=\"color:#F5F0E8;\">Prompts delivered to WhatsApp.<\u002Fdiv>\n          <div class=\"how-body\" style=\"color:#F5F0E8;\">Partner, nanny, grandparents. Each person gets what they need, at the right time, in the right format, directly in WhatsApp. Nobody plays messenger. Nobody has to chase.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- JOSEFIN IN ACTION -->\n<section class=\"section ja-sec\" id=\"demo\" data-screen-label=\"Josefin in action\" style=\"padding: via WhatsApp<\u002Fspan>\n                  <time>21:42<\u002Ftime>\n                <\u002Fdiv>\n                <div class=\"brief-greeting\">Here's what's coming up tomorrow.<\u002Fdiv>\n                <ul class=\"brief-list\">\n                  <li><b>Dress Ava in her World Book Day costume<\u002Fb> <span>for dropoff at 8:30am.<\u002Fspan><\u002Fli>\n                  <li><b>School trip release form<\u002Fb> <span>due by 3pm.<\u002Fspan> <a href=\"#trip-form\" onclick=\"event.preventDefault();\">stmarys.school/trip-form<\u002Fa><\u002Fli>\n                  <li><b>Pickup at 3pm.<\u002Fb> <span>Jason to handle.<\u002Fspan><\u002Fli>\n                  <li><b>Ballet at 4:15pm.<\u002Fb> <span>Ms Kelly to handle.<\u002Fspan><\u002Fli>\n                  <li><b>Dinner at Sarah's tomorrow.<\u002Fb> <span>Pick up dessert at 7:30 en route home. Ms. Kelly will stay late to put the children to bed.<\u002Fspan><\u002Fli>\n                <\u002Ful>\n                <div class=\"moment-foot\">\n                  <span class=\"ticks\">\n                    <svg viewBox=\"0 0 18 11\" width=\"16\" height=\"11\" fill=\"none\" stroke=\"#53BDEB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-label=\"Read\"><polyline points=\"1 6 4 9 9 2\"><\u002Fpolyline><polyline points=\"7 6 10 9 17 2\"><\u002Fpolyline><\u002Fsvg>\n                    <time>Read 21:43<\u002Ftime>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 02. Plans that adapt -->\n          <div class=\"slide flip\">\n            <div class=\"slide-text\">\n              <div class=\"slide-num\">02<\u002Fdiv>\n              <h3 class=\"slide-h\">Sees the ripple effects, <em>and coordinates the responses.<\u002Fem><\u002Fh3>\n              <p class=\"slide-body\">Josefin notices the ripple effects you'd otherwise be chasing. A flight rescheduled, an insurance window, a knock-on for the car hire, the villa, the school run home. Quietly held together.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"slide-moment\">\n              <div class=\"moment\">\n                <div class=\"moment-meta\">\n                  <span class=\"j-dot\">J<\u002Fspan>\n                  <span>Josefin<\u002Fspan>\n                  <span class=\"sep\">·<\u002Fspan>\n                  <span class=\"wa-tag\">via WhatsApp<\u002Fspan>\n                  <time>Tue 18:04<\u002Ftime>\n                <\u002Fdiv>\n                <div class=\"moment-body\">\n                  <p>Your <em>Lisbon flight in October<\u002Fem> has been rescheduled to land six hours later.<\u002Fp>\n                  <p>I've checked: travel insurance still covers it, but the car hire desk closes before you arrive, and the villa check-in needs pushing.<\u002Fp>\n                  <p>Shall I move the hire to morning, reschedule check-in, and let the kids' club know you'll miss day one?<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"moment-foot\">\n                  <span class=\"ticks\">\n                    <svg viewBox=\"0 0 18 11\" width=\"16\" height=\"11\" fill=\"none\" stroke=\"#53BDEB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"1 6 4 9 9 2\"><\u002Fpolyline><polyline points=\"7 6 10 9 17 2\"><\u002Fpolyline><\u002Fsvg>\n                    <time>Read Tue 18:09<\u002Ftime>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 03. Voice-note questions, researched answers -->\n          <div class=\"slide\">\n            <div class=\"slide-text\">\n              <div class=\"slide-num\">03<\u002Fdiv>\n              <h3 class=\"slide-h\">Researches like you would, <em>if you had the time<\u002Fem>.<\u002Fh3>\n              <p class=\"slide-body\">Use Josefin as your thought partner - half-term plans, a question about a phase one of the kids is going through, recipes that work around the allergies. Josefin researches what's relevant, weighs what it knows about your family, and replies with something genuinely useful.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"slide-moment\">\n              <!-- Inbound voice note from the user -->\n              <div class=\"vn-prompt\">\n                <div class=\"vn-avatar\">E<\u002Fdiv>\n                <div class=\"vn-body\">\n                  <div class=\"vn-meta\"><b>You<\u002Fb><span>· voice note<\u002Fspan><time>Thu 08:42<\u002Ftime><\u002Fdiv>\n                  <div class=\"vn-player\">\n                    <button class=\"vn-play\" aria-label=\"Play voice note\"><svg viewBox=\"0 0 10 12\" width=\"8\" height=\"9\" fill=\"currentColor\" aria-hidden=\"true\"><polygon points=\"0,0 10,6 0,12\"><\u002Fpolygon><\u002Fsvg><\u002Fbutton>\n                    <div class=\"vn-wave\" aria-hidden=\"true\">\n                      <span class=\"played\" style=\"height:6px\"><\u002Fspan><span class=\"played\" style=\"height:10px\"><\u002Fspan><span class=\"played\" style=\"height:14px\"><\u002Fspan><span class=\"played\" style=\"height:8px\"><\u002Fspan><span class=\"played\" style=\"height:12px\"><\u002Fspan><span class=\"played\" style=\"height:16px\"><\u002Fspan><span class=\"played\" style=\"height:10px\"><\u002Fspan><span class=\"played\" style=\"height:7px\"><\u002Fspan><span class=\"played\" style=\"height:13px\"><\u002Fspan><span class=\"played\" style=\"height:15px\"><\u002Fspan><span class=\"played\" style=\"height:9px\"><\u002Fspan><span class=\"played\" style=\"height:11px\"><\u002Fspan><span style=\"height:14px\"><\u002Fspan><span style=\"height:8px\"><\u002Fspan><span style=\"height:12px\"><\u002Fspan><span style=\"height:16px\"><\u002Fspan><span style=\"height:10px\"><\u002Fspan><span style=\"height:6px\"><\u002Fspan><span style=\"height:13px\"><\u002Fspan><span style=\"height:9px\"><\u002Fspan><span style=\"height:11px\"><\u002Fspan><span style=\"height:7px\"><\u002Fspan><span style=\"height:14px\"><\u002Fspan><span style=\"height:10px\"><\u002Fspan><span style=\"height:8px\"><\u002Fspan><span style=\"height:12px\"><\u002Fspan><span style=\"height:6px\"><\u002Fspan><span style=\"height:9px\"><\u002Fspan>\n                    <\u002Fdiv>\n                    <span class=\"vn-time\">0:34<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"vn-transcript\">\"Hey Josefin - thanks for the nudge on the long weekend. Can you sketch out activities like you did for&nbsp;half-term? Would love a day trip suggestion out of London... Also Theo's been waking at 5 again, anything I should be reading on that?\"<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Josefin's researched reply -->\n              <div class=\"moment\">\n                <div class=\"moment-meta\">\n                  <span class=\"j-dot\">J<\u002Fspan>\n                  <span>Josefin<\u002Fspan>\n                  <span class=\"sep\">·<\u002Fspan>\n                  <span class=\"wa-tag\">via WhatsApp<\u002Fspan>\n                  <time>Thu 08:47<\u002Ftime>\n                <\u002Fdiv>\n                <div class=\"brief-greeting\">Of course, how do these sound?<\u002Fdiv>\n                <ul class=\"brief-list\">\n                  <li><b>Sat - Hampstead Heath, then Kenwood House.<\u002Fb> <span>Big outdoor morning, then a quiet afternoon. Ava does well on mixed days.<\u002Fspan><\u002Fli>\n                  <li><b>Sun - Slow day at home.<\u002Fb> <span>Theo's been overstimulated since the half-term concert; so some downtime after the heath builds in recovery.<\u002Fspan><\u002Fli>\n                  <li><b>Mon - Day trip to Whitstable.<\u002Fb> <span>1h45 drive, to catch the tide between 11-3,; you and Jason can treat yourselves to oysters at Wheelers&nbsp;<\u002Fspan><\u002Fli>\n                  <li><b>On Theo's 5am waking<\u002Fb> <span>- this tracks with a normal sleep regression around his age. I've pulled three pieces worth reading, Want to look at them now?<\u002Fspan><\u002Fli>\n                <\u002Ful>\n                <div class=\"moment-foot\">\n                  <span class=\"ticks\">\n                    <svg viewBox=\"0 0 18 11\" width=\"16\" height=\"11\" fill=\"none\" stroke=\"#53BDEB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"1 6 4 9 9 2\"><\u002Fpolyline><polyline points=\"7 6 10 9 17 2\"><\u002Fpolyline><\u002Fsvg>\n                    <time>Read Thu 08:51<\u002Ftime>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 04. Shared mental load -->\n          <div class=\"slide flip\">\n            <div class=\"slide-text\">\n              <div class=\"slide-num\">04<\u002Fdiv>\n              <h3 class=\"slide-h\">Everyone <em>knows the plan<\u002Fem>, without you telling them.<\u002Fh3>\n              <p class=\"slide-body\">School forms, pickups, the gift you keep meaning to order, the dentist nobody got around to rebooking. Josefin follows up with the right person at the right time. No more being the default reminder system.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"slide-moment\">\n              <div class=\"moment\">\n                <div class=\"moment-meta\">\n                  <span class=\"j-dot\">J<\u002Fspan>\n                  <span>Josefin<\u002Fspan>\n                  <span class=\"sep\">·<\u002Fspan>\n                  <span class=\"wa-tag\">via WhatsApp<\u002Fspan>\n                  <time>17:30<\u002Ftime>\n                <\u002Fdiv>\n                <div class=\"brief-greeting\">Already handled today.<\u002Fdiv>\n                <ul class=\"brief-list\">\n                  <li><b>Ava's swimming kit reminder<\u002Fb> <span>sent to Stephen.<\u002Fspan><\u002Fli>\n                  <li><b>Theo's birthday gift<\u002Fb> <span>ordered with your mum.<\u002Fspan><\u002Fli>\n                  <li><b>Friday late pickup<\u002Fb> <span>updated with Ms. Kelly.<\u002Fspan><\u002Fli>\n                  <li><b>Grandparents briefed<\u002Fb> <span>on the school run swap.<\u002Fspan><\u002Fli>\n                  <li><b>Stephen confirmed<\u002Fb> <span>for ballet dropoff at 4:15.<\u002Fspan><\u002Fli>\n                <\u002Ful>\n                <div class=\"moment-foot\">\n                  <span class=\"ticks\">\n                    <svg viewBox=\"0 0 18 11\" width=\"16\" height=\"11\" fill=\"none\" stroke=\"#53BDEB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"1 6 4 9 9 2\"><\u002Fpolyline><polyline points=\"7 6 10 9 17 2\"><\u002Fpolyline><\u002Fsvg>\n                    <time>Read 17:34<\u002Ftime>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- 05. Notices before you do -->\n          <div class=\"slide\">\n            <div class=\"slide-text\">\n              <div class=\"slide-num\">05<\u002Fdiv>\n              <h3 class=\"slide-h\">Notices <em>before you do.<\u002Fem><\u002Fh3>\n              <p class=\"slide-body\">Josefin learns the patterns you've never named: the gym sessions that always slip during busy weeks, the friction that keeps coming back on Wednesdays, the little compromises that quietly add up. It adjusts before things become a problem.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"slide-moment\">\n              <div class=\"moment\">\n                <div class=\"moment-meta\">\n                  <span class=\"j-dot\">J<\u002Fspan>\n                  <span>Josefin<\u002Fspan>\n                  <span class=\"sep\">·<\u002Fspan>\n                  <span class=\"wa-tag\">via WhatsApp<\u002Fspan>\n                  <time>Wed 10:20<\u002Ftime>\n                <\u002Fdiv>\n                <div class=\"moment-body\">\n                  <p>You tend to skip the <em>Friday gym session<\u002Fem> when the school week's been heavy.<\u002Fp>\n                  <p>Next week looks like one of those. Want me to move it to Saturday morning now, before the studio fills up?<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"moment-foot\">\n                  <span class=\"ticks\">\n                    <svg viewBox=\"0 0 18 11\" width=\"16\" height=\"11\" fill=\"none\" stroke=\"#53BDEB\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"1 6 4 9 9 2\"><\u002Fpolyline><polyline points=\"7 6 10 9 17 2\"><\u002Fpolyline><\u002Fsvg>\n                    <time>Read Wed 10:24<\u002Ftime>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"car-controls\" style=\"margin: 0px; padding: 10px;\">\n        <div class=\"car-dots\" id=\"supportDots\">\n          <button class=\"car-dot is-active\" data-i=\"0\" aria-label=\"Slide 1\"><\u002Fbutton>\n          <button class=\"car-dot\" data-i=\"1\" aria-label=\"Slide 2\"><\u002Fbutton>\n          <button class=\"car-dot\" data-i=\"2\" aria-label=\"Slide 3\"><\u002Fbutton>\n          <button class=\"car-dot\" data-i=\"3\" aria-label=\"Slide 4\"><\u002Fbutton>\n          <button class=\"car-dot\" data-i=\"4\" aria-label=\"Slide 5\"><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"car-counter\"><b id=\"supportCounter\">01<\u002Fb><span style=\"color:var(--ink-30);\">&nbsp;/&nbsp;05<\u002Fspan><\u002Fdiv>\n        <div class=\"car-nav\">\n          <button id=\"supportPrev\" aria-label=\"Previous\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n href=\"signin.html\" class=\"relief-cta\">Let Josefin handle it →<\u002Fa>\n        <a href=\"https://tally.so/r/VLbL4g\" target=\"_blank\" rel=\"noopener\" class=\"relief-cta-ghost\">Join the Waitlist<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOUNDER -->\n<section class=\"section founder-sec\" style=\"background: var(--bg-mid); padding: 80px 80px 60px\">\n  <div class=\"wrap\">\n    <div class=\"founder-single\">\n      <div class=\"sec-eye\">From the <span style=\"color:#c49020\">founder<\u002Fspan><\u002Fdiv>\n      <blockquote class=\"founder-blockquote\">\n        <p>“The more people I spoke to, the more I noticed the same pattern:&nbsp;modern life quietly depends on someone remembering everything.<\u002Fp>\n        <p>The forms. The appointments. The follow-ups. The things that need chasing. The details that hold a household together behind the scenes.<\u002Fp>\n        <p>I started Josefin because I believe people deserve more support in their everyday lives - intelligent systems that help things run smoothly, keep people coordinated, and stop important details from slipping through the cracks.<\u002Fp>\n        <p>Something calm, capable, and genuinely helpful.&nbsp;Technology that understands the context around your life, helps carry the mental load, and quietly keeps things moving.<\u002Fp>\n        <p>\n<\u002Fp>\n      <\u002Fblockquote>\n      <div class=\"founder-sig\">\n        <div class=\"founder-av\" style=\"overflow:hidden;\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAA      <span class=\"faq-q\">Is my email data private?<\u002Fspan>\n          <span class=\"faq-icon\">+<\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\"><div>Josefin reads only what you connect and give it access to. Your data is never sold, never used for training, and you can disconnect at any time. We are guided by GDPR regulations and uphold all the obligations for data storage and security.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\">\n        <summary class=\"faq-btn\">\n          <span class=\"faq-q\">Why can’t I just use ChatGPT or Claude to do this myself?<\u002Fspan>\n          <span class=\"faq-icon\">+<\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\"><div>General-purpose AI is a powerful tool. But you’re still the one setting it up, maintaining the connections, and remembering to check in. Josefin is built around your household: it knows the children, the nanny, the calendar, the rhythm of the week. It acts without being asked, coordinates across people, and tailors each message to who’s receiving it. A tool is something you use. Josefin is something that runs.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\">\n        <summary class=\"faq-btn\">\n          <span class=\"faq-q\">What email providers are supported?<\u002Fspan>\n          <span class=\"faq-icon\">+<\u002Fspan>\n        <\u002Fsummary>\n        <div class=\"faq-a\"><div>Gmail and Outlook today. Apple Mail and others are on the roadmap. You can also simply forward emails to a Josefin address.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<div class=\"cta-sec\" id=\"waitlist\">\n  <div class=\"cta-bg-j\" aria-hidden=\"true\">J<\u002Fdiv>\n  <div class=\"cta-inner\">\n    <div class=\"sec-eye acc\" style=\"justify-content:center;\">Join the waitlist<\u002Fdiv>\n    <h2 class=\"cta-h\">Ready to<br>breathe again?<\u002Fh2>\n    <p
